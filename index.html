<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Personal Dashboard</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/my-dashboard/manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f0f0f; color: #ffffff; -webkit-tap-highlight-color: transparent; }
        .custom-blur { background: rgba(20, 20, 20, 0.7); backdrop-filter: blur(12px); }
    </style>
</head>
<body class="font-sans antialiased pb-24">

    <div id="auth-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#0f0f0f] px-6">
        <div class="w-full max-w-md space-y-6 custom-blur p-8 rounded-2xl border border-neutral-800">
            <h1 class="text-3xl font-bold tracking-tight text-center">welcome, king</h1>
            <p class="text-sm text-neutral-400 text-center">sign in to sync your personal dashboard</p>
            <div class="space-y-4">
                <input id="auth-email" type="email" placeholder="email" class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-neutral-600">
                <input id="auth-password" type="password" placeholder="password" class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-neutral-600">
                <button onclick="handleAuth('signin')" class="w-full bg-white text-black font-semibold rounded-xl py-3 hover:bg-neutral-200 transition">sign in</button>
                <button onclick="handleAuth('signup')" class="w-full bg-neutral-900 text-neutral-400 border border-neutral-800 rounded-xl py-3 hover:text-white transition text-sm">create account</button>
            </div>
            <p id="auth-error" class="text-red-500 text-sm text-center hidden"></p>
        </div>
    </div>

    <div id="username-screen" class="fixed inset-0 z-40 flex flex-col items-center justify-center bg-[#0f0f0f] px-6 hidden">
        <div class="w-full max-w-md space-y-4 custom-blur p-8 rounded-2xl border border-neutral-800">
            <h2 class="text-2xl font-bold">set your username</h2>
            <input id="username-input" type="text" placeholder="username" class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-3 text-white focus:outline-none">
            <button onclick="saveUsername()" class="w-full bg-white text-black font-semibold rounded-xl py-3">continue</button>
        </div>
    </div>

    <div id="app-screen" class="max-w-lg mx-auto px-4 pt-8 space-y-6 hidden">
        <div class="flex justify-between items-center">
            <div>
                <p class="text-neutral-500 text-sm">welcome back,</p>
                <h1 id="greeting-name" class="text-2xl font-bold tracking-tight">king</h1>
            </div>
            <button onclick="logout()" class="text-xs text-neutral-500 border border-neutral-800 rounded-lg px-3 py-1.5">logout</button>
        </div>

        <div class="space-y-3">
            <h2 class="text-lg font-semibold tracking-tight text-neutral-400">apple health sync</h2>
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-neutral-900 p-4 rounded-2xl border border-neutral-800">
                    <p class="text-xs text-neutral-500">steps</p>
                    <p id="metric-steps" class="text-2xl font-bold mt-1">0</p>
                    <div class="w-full bg-neutral-800 h-1.5 rounded-full mt-2 overflow-hidden">
                        <div id="progress-steps" class="bg-white h-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>
                <div class="bg-neutral-900 p-4 rounded-2xl border border-neutral-800">
                    <p class="text-xs text-neutral-500">calories burnt</p>
                    <p id="metric-calories" class="text-2xl font-bold mt-1">0 kcal</p>
                </div>
                <div class="bg-neutral-900 p-4 rounded-2xl border border-neutral-800">
                    <p class="text-xs text-neutral-500">sleep</p>
                    <p id="metric-sleep" class="text-2xl font-bold mt-1">0h</p>
                </div>
                <div class="bg-neutral-900 p-4 rounded-2xl border border-neutral-800">
                    <p class="text-xs text-neutral-500">weight</p>
                    <p id="metric-weight" class="text-2xl font-bold mt-1">-- kg</p>
                </div>
            </div>
            <div class="bg-neutral-900 p-4 rounded-2xl border border-neutral-800 flex justify-between items-center">
                <span class="text-xs text-neutral-500">resting heart rate</span>
                <span id="metric-hr" class="text-lg font-bold">-- bpm</span>
            </div>
        </div>

        <div class="bg-neutral-900 p-5 rounded-2xl border border-neutral-800 space-y-4">
            <h2 class="text-lg font-semibold tracking-tight">tasks</h2>
            <div class="flex gap-2">
                <input id="todo-input" type="text" placeholder="add a new task..." class="flex-1 bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-2 text-sm text-white focus:outline-none">
                <button onclick="addTodo()" class="bg-white text-black px-4 rounded-xl text-sm font-semibold">add</button>
            </div>
            <ul id="todo-list" class="space-y-2 max-h-52 overflow-y-auto"></ul>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://ylblkpjcihyhhdwvgigp.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_ghk4UE0_C2yn4TQFYwIvmg_O-s3Ou13";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;

        // Auth management
        supabase.auth.onAuthStateChange((event, session) => {
            if (session) {
                currentUser = session.user;
                document.getElementById('auth-screen').classList.add('hidden');
                checkProfile();
            } else {
                currentUser = null;
                document.getElementById('app-screen').classList.add('hidden');
                document.getElementById('auth-screen').classList.remove('hidden');
            }
        });

        async function handleAuth(type) {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const errEl = document.getElementById('auth-error');
            errEl.classList.add('hidden');

            if (!email || !password) return;

            const { data, error } = type === 'signin' 
                ? await supabase.auth.signInWithPassword({ email, password })
                : await supabase.auth.signUp({ email, password });

            if (error) {
                errEl.innerText = error.message;
                errEl.classList.remove('hidden');
            }
        }

        async function checkProfile() {
            const { data, error } = await supabase
                .from('profiles')
                .select('username')
                .eq('id', currentUser.id)
                .single();

            if (error || !data) {
                document.getElementById('username-screen').classList.remove('hidden');
            } else {
                document.getElementById('username-screen').classList.add('hidden');
                document.getElementById('greeting-name').innerText = data.username;
                document.getElementById('app-screen').classList.remove('hidden');
                loadDashboardData();
            }
        }

        async function saveUsername() {
            const username = document.getElementById('username-input').value.trim();
            if (!username) return;

            const { error } = await supabase
                .from('profiles')
                .insert({ id: currentUser.id, username: username });

            if (!error) checkProfile();
        }

        // Load metrics and todos
        async function loadDashboardData() {
            const today = new Date().toISOString().split('T')[0];
            
            // Fetch metrics
            const { data: metrics } = await supabase
                .from('health_metrics')
                .select('*')
                .eq('user_id', currentUser.id)
                .eq('date', today)
                .maybeSingle();

            if (metrics) {
                document.getElementById('metric-steps').innerText = (metrics.steps || 0).toLocaleString();
                document.getElementById('metric-calories').innerText = `${metrics.calories || 0} kcal`;
                document.getElementById('metric-sleep').innerText = `${metrics.sleep_hours || 0}h`;
                document.getElementById('metric-weight').innerText = metrics.weight ? `${metrics.weight} kg` : '-- kg';
                document.getElementById('metric-hr').innerText = metrics.resting_hr ? `${metrics.resting_hr} bpm` : '-- bpm';

                // Progress bar steps (target 10,000 steps)
                const stepPercent = Math.min(((metrics.steps || 0) / 10000) * 100, 100);
                document.getElementById('progress-steps').style.width = `${stepPercent}%`;
            }

            // Fetch Todos
            const { data: todos } = await supabase
                .from('todos')
                .select('*')
                .eq('user_id', currentUser.id)
                .order('created_at', { ascending: true });

            const listEl = document.getElementById('todo-list');
            listEl.innerHTML = '';
            if (todos) {
                todos.forEach(todo => {
                    const li = document.createElement('li');
                    li.className = "flex items-center justify-between bg-neutral-950 px-4 py-3 rounded-xl border border-neutral-800 text-sm";
                    li.innerHTML = `
                        <div class="flex items-center gap-3">
                            <input type="checkbox" ${todo.done ? 'checked' : ''} onclick="toggleTodo('${todo.id}', ${todo.done})" class="accent-white">
                            <span class="${todo.done ? 'line-through text-neutral-500' : ''}">${todo.text}</span>
                        </div>
                        <button onclick="deleteTodo('${todo.id}')" class="text-neutral-500 hover:text-red-400">delete</button>
                    `;
                    listEl.appendChild(li);
                });
            }
        }

        async function addTodo() {
            const input = document.getElementById('todo-input');
            const text = input.value.trim();
            if (!text) return;

            await supabase.from('todos').insert({ user_id: currentUser.id, text: text });
            input.value = '';
            loadDashboardData();
        }

        async function toggleTodo(id, currentStatus) {
            await supabase.from('todos').update({ done: !currentStatus }).eq('id', id);
            loadDashboardData();
        }

        async function deleteTodo(id) {
            await supabase.from('todos').delete().eq('id', id);
            loadDashboardData();
        }

        async function logout() {
            await supabase.auth.signOut();
        }
    </script>
</body>
</html>
